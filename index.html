
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furqan Coin - Saudi Mining Network</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#041212;color:white;max-width:480px;margin:0 auto;padding-bottom:110px}
.amiri{font-family:'Amiri',serif}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;background:rgba(4,18,18,0.9);backdrop-filter:blur(10px);z-index:20}
.logo{width:36px;height:36px;background:linear-gradient(to bottom right,#FDE68A,#D4AF37);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin:12px}
.coin-wrap{perspective:1200px;display:flex;justify-content:center;margin-top:30px}
.coin{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #FFEB99, #D4AF37, #8B6914);border:6px solid rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;text-align:center;animation:spin 6s linear infinite;box-shadow:0 0 60px rgba(212,175,55,0.35)}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
.btn-yellow{background:#FACC15;color:#000;font-weight:800;padding:12px;border-radius:12px;border:0;width:100%;cursor:pointer}
.btn-green{background:#25D366;color:#fff;font-weight:800;padding:12px;border-radius:12px;border:0;width:100%;cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,100px);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;transition:0.3s;z-index:50}
#toast.show{transform:translate(-50%,0);opacity:1}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#020a0a;border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-around;padding:14px 0;font-size:11px}
</style>
</head>
<body>
<div class="header">
  <div  class="logo">F</div><div><div style="font-weight:700;font-size:13px">Furqan Coin</div><div style="font-size:10px;opacity:0.5;letter-spacing:2px">SAUDI MINING NETWORK</div></div></div>
  <button style="background:#FACC15;color:#000;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;border:0">● Deploy</button>
</div>

<div class="glass" style="display:flex;justify-content:space-between;align-items:center">
  <div style="display:flex;gap:10px;align-items:center"><img src="https://i.pravatar.cc/100?img=15" style="width:40px;height:40px;border-radius:50%;border:2px solid #D4AF37"><div><div style="font-weight:700;font-size:13px">Shahid Khan</div><div style="font-size:11px;opacity:0.4">Shahid_khan</div></div></div>
  <div style="background:rgba(250,204,21,0.1);color:#FACC15;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700">+0.192 FQN/hr</div>
</div>

<div style="text-align:center;padding:10px">
  <div  UNMINED BALANCE</div>
  <div style="font-size:42px;font-weight:800;margin-top:4px"><span id="balance">7.23293</span> <span style="color:#FACC15;font-size:22px">FQN</span></div>
  <div class="coin-wrap"><div id="coin" class="coin"><div><div class="amiri" style="font-size:48px;color:#3d2c00;font-weight:900">فرقان</div><div style="color:#3d2c00;font-weight:900;font-size:13px;letter-spacing:2px">1 FQN</div></div></div></div>
  <div style="margin-top:20px;display:flex;justify-content:space-between" class="glass"><span style="font-size:11px">🟢 Mining Active</span><span id="timer" style="font-size:12px;color:#FACC15;font-weight:700">18:54:22</span></div>
</div>

<div class="glass">
  <div style="display
  style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <div>⚡ Mining Active</div>
    <div style="color:#FACC15">+0.00004 FQN/sec</div>
  </div>
</div>

<div style="text-align:center;padding:10px">
  <div>UNMINED BALANCE</div>
  <div style="font-size:42px;font-weight:800;margin:8px 0" id="bal">7.23293 FQN</div>
  <div class="coin-wrap"><div id="coin" class="coin" style="width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 25%, #FFF8C6 0%, #FFD700 22%, #D4AF37 60%, #8B6914 100%);border:7px solid #FFEB8A;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(250,204,21,0.4);transform-style:preserve-3d">
    <div style="font-family:Amiri,serif;font-size:48px;color:#3d2c00;font-weight:900">فرقان</div>
    <div style="font-size:36px">⚖️</div>
    <div style="font-weight:900;color:#3d2c00;letter-spacing:2px">1 FQN</div>
  </div></div>
  <div style="margin-top:20px;display:flex;justify-content:center;gap:10px">
    <button class="btn-yellow" id="mineBtn">⛏️ START MINING</button>
    <button class="btn-green">Connect</button>
  </div>
</div>

<div class="glass">
  <div style="display:flex;justify-content:space-between;font-size:12px">
    <span style="color:#25D366">● 24h Session Active</span>
    <span style="color:#FACC15">18:54:23</span>
  </div>
  <div style="height:4px;background:rgba(255,255,255,0.1);border-radius:99px;margin-top:8px"><div style="width:21%;height:100%;background:#FACC15;border-radius:99px"></div></div>
</div>

<div class="glass">
  <div>YOUR INTERLINK CODE: <b>FQN-78601</b></div>
  <button class="btn-yellow" style="margin-top:10px;width:100%">Copy Interlink</button>
</div>

<div id="toast">Copied!</div>

<script>
let bal=7.23293, rot=0, vel=0.6, drag=false, sx=0;
const coin=document.getElementById('coin');
function loop(){ if(!drag){ rot+=vel; if(vel<0.5) vel=0.5 } coin.style.transform=`rotateY(${rot}deg) rotateX(12deg)`; requestAnimationFrame(loop)} loop();
setInterval(()=>{ bal+=0.00004; document.getElementById('bal').innerText=bal.toFixed(5)+' FQN'},80);
coin.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;vel=0;coin.setPointerCapture(e.pointerId)});
addEventListener('pointerup',()=>{drag=false;vel=1.2});
addEventListener('pointermove',e=>{ if(!drag) return; let d=e.clientX-sx; rot+=d*1.2; vel=d*0.18; sx=e.clientX });
document.getElementById('mineBtn').onclick=function(){ alert('Mining Started!'); }
</script>
</body>
</html>
