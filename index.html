
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furqan Coin 24H</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#050a1a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}.card{width:100%;max-width:400px;background:#0f1735;border-radius:20px;padding:20px;text-align:center;margin-top:12px}.bal{font-size:38px;font-weight:900;color:#facc15}.coin{width:180px;height:180px;margin:18px auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffef8a,#facc15,#a16207);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}.timer{font-size:26px;font-weight:800;color:#facc15}.prog{height:8px;background:#122a1a;border-radius:10px;margin-top:10px}.fill{height:100%;background:#facc15;width:17%}</style></head><body><h2 style="color:#facc15">🪙 Furqan Coin</h2><div class="card"><div class="bal" id="bal">7.06919 FQN</div><div id="tmr" class="timer">23:59:59</div><div class="prog"><div id="fill" class="fill"></div></div><div id="pct" style="color:#888;font-size:11px;margin-top:5px">17.6%</div><div class="coin">1 FQN</div></div><script>const D=86400000;let s=parseInt(localStorage.getItem('fqn_s')||0);if(!s){s=Date.now()-D*0.176;localStorage.setItem('fqn_s',s)}let b=parseFloat(localStorage.getItem('fqn_b')||'7.06919');setInterval(()=>{let e=Date.now()-s;let r=D-e;if(r<=0)return;b+=0.192/3600;localStorage.setItem('fqn_b',b);document.getElementById('bal').innerText=b.toFixed(5)+' FQN';let h=Math.floor(r/3600000),m=Math.floor(r%3600000/60000),ss=Math.floor(r%60000/1000);document.getElementById('tmr').innerText=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');let p=(e/D*100).toFixed(1);document.getElementById('fill').style.width=p+'%';document.getElementById('pct').innerText=p+'%'},1000)</script></body></html>
