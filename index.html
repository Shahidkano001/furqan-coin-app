// 24 hour timer logic - improved
useEffect(() => {
  if (!mining) return;

  const timer = setInterval(() => {
    setTimeLeft((t) => {
      if (t <= 1) {
        setMining(false);
        return 0;
      }
      return t - 1;
    });

    setCoins((c) => c + 0.00001);
  }, 1000);

  return () => clearInterval(timer);
}, [mining]);
